[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyx-node"
dynamic = ["version"]
description = "Python bindings for NyxNode"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    {name = "Jérôme ODIER", email = "jerome.odier@lpsc.in2p3.fr"},
]

requires-python = ">=3.8"
dependencies = []

[tool.hatch.version]
path = "nyx/__init__.py"
pattern = '''__version__\s*=\s*['"](?P<version>[^'"]+)['"]'''

[tool.hatch.build.targets.wheel]
packages = ["nyx"]

[tool.hatch.build]
exclude = [
    "docs/*",
    "src/*",
    "test/*",
]
