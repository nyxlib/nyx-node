[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyx-node"
version = "1.0.0b6"
description = "Python bindings for NyxNode"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    {name = "Jérôme ODIER", email = "jerome.odier@lpsc.in2p3.fr"},
]

requires-python = ">=3.8"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["nyx"]

[tool.hatch.build]
exclude = ["docs/*", "src/*", "test/*"]
